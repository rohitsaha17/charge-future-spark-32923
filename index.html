    <!-- Canonical + self-referencing hreflang.
         Each tag ships with a non-empty href default so audit tools
         that snapshot the pre-JS HTML never see a bare <link> (which
         was being flagged as a critical canonical / hreflang error).
         The inline script below refines them per-path at runtime —
         for non-root paths it appends the actual pathname, and for
         the apluscharge.in mirror it switches the host to .in so
         each domain self-canonicalizes. -->
    <link rel="canonical" id="canonical-link" href="https://www.apluscharge.com/" />
    <link rel="alternate" hreflang="en" id="hreflang-en" href="https://www.apluscharge.com/" />
    <link rel="alternate" hreflang="en-IN" id="hreflang-enin" href="https://www.apluscharge.com/" />
    <link rel="alternate" hreflang="x-default" id="hreflang-xdefault" href="https://www.apluscharge.com/" />
    <script>
      (function () {
        try {
          var origin = (location && location.origin) || 'https://www.apluscharge.com';
          var rawPath = (location && location.pathname) || '/';
          var path = rawPath === '/' ? '/' : rawPath.replace(/\/+$/, '');
          var url = origin + path;
          var ids = ['canonical-link', 'hreflang-en', 'hreflang-enin', 'hreflang-xdefault'];
          for (var i = 0; i < ids.length; i++) {
            var el = document.getElementById(ids[i]);
            if (el) el.setAttribute('href', url);
          }
        } catch (e) { /* best-effort only — the static defaults above stay valid */ }
      })();
    </script>

    <!-- Content Security Policy — safety net if XSS ever slips past
         sanitization. Allowlist every host this site actually loads.
         Notes:
         - `blob:` is required in script-src / worker-src so Lighthouse,
           Maplibre, and DOMPurify can instantiate Blob workers. Without
           it the PageSpeed audit aborts with "NO_FCP" and all metrics
           come back empty.
         - `frame-ancestors` only works as an HTTP header (browsers
           ignore it in <meta>) so it's set at the host. Omitting from
           meta stops SEO crawlers from mis-parsing it. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://www.googletagmanager.com https://www.google-analytics.com https://maps.googleapis.com https://maps.gstatic.com;
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com data:;
      img-src 'self' http://localhost:4000 data: blob: https:;
      connect-src 'self' http://localhost:4000 https://www.googletagmanager.com https://www.google-analytics.com https://*.google.com https://maps.googleapis.com https://maps.gstatic.com https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://photon.komoot.io https://nominatim.openstreetmap.org;
      frame-src 'self' https://www.google.com https://www.youtube.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    " />
